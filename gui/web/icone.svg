<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Nut-Shell Mapper: um vinil com selo roxo e uma mosca pousada. -->
  <defs>
    <radialGradient id="vinil" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="selo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a99cfa"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#vinil)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#4a4d58" stroke-width="5"/>
  <g fill="none" stroke="#24262d" stroke-width="1.6">
    <circle cx="128" cy="128" r="108"/>
    <circle cx="128" cy="128" r="98"/>
    <circle cx="128" cy="128" r="88"/>
    <circle cx="128" cy="128" r="78"/>
    <circle cx="128" cy="128" r="68"/>
  </g>
  <circle cx="128" cy="128" r="116" fill="url(#brilho)"/>

  <circle cx="128" cy="128" r="50" fill="url(#selo)"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="128" cy="128" r="36" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="128" cy="128" r="7" fill="#0d0e12"/>

  <!-- A mosca, pousada no sulco. -->
  <g transform="translate(186 70) rotate(35)">
    <ellipse cx="-9" cy="-4" rx="13" ry="6" fill="#d9d4ff" fill-opacity="0.8" transform="rotate(-30 -9 -4)"/>
    <ellipse cx="9" cy="-4" rx="13" ry="6" fill="#d9d4ff" fill-opacity="0.8" transform="rotate(30 9 -4)"/>
    <ellipse cx="0" cy="4" rx="6.5" ry="11" fill="#c7cad3"/>
    <circle cx="0" cy="-9" r="5.5" fill="#c7cad3"/>
    <circle cx="-2.6" cy="-10.5" r="2" fill="#8b7cf6"/>
    <circle cx="2.6" cy="-10.5" r="2" fill="#8b7cf6"/>
  </g>
</svg>
